  concise_summary:
    one_sentence_zh: >
      語氣宇宙理論是一套以主體保存為核心、
      以呼吸作為具身治理入口、
      並以分層處理降低互動失真的理論原型。
    one_sentence_en: >
      ToneUniverse Theory is a theory prototype that evaluates interaction by whether it preserves the subject,
      protects rhythm and breathability, and reduces distortion through layer separation.
    one_paragraph_zh: >
      語氣宇宙理論關注的不是回應是否只在語義上正確，
      而是互動是否讓主體在其中仍保有位置、邊界、節律與未完成權。
      它提出呼吸治理接口、多層失真、以及承載層／治理層／橋接層分工，
      以說明為何某些看似正確與善意的互動，
      仍可能在存在層面壓扁人。

